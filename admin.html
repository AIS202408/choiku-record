<style>
/* Layout: wide admin column; same navy / ice-blue identity as the 超育 apps */
:root{
  --bg:#ffffff;--surface:#eef3f9;--line:#dbe3ee;--fg:#1b2333;--muted:#6b7487;
  --ink:#17336d;--accent:#1f4596;--good:#2f7a6a;--mid:#a0701f;--warn:#b5533c;--ice-a:#c9d9ee;--ice-b:#f4f8fc;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--surface:#18202f;--line:#2a3447;--fg:#eaeef5;--muted:#9aa4b8;--ink:#c9d8f3;--accent:#8fb2f0;--good:#7cc4b2;--mid:#e0b46a;--warn:#e08a74;--ice-a:#26324a;--ice-b:#161d2b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) 48px}
[hidden]{display:none!important}
img{max-width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:14px;min-width:0}
.top .logo{height:26px;width:auto}
@media (prefers-color-scheme:dark){.top .logo{filter:brightness(0) invert(.9)}}
.top h1{font-size:20px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.5}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:10px 12px;width:100%}
.login{max-width:380px;margin:48px auto 0;display:grid;gap:14px}
.note{font-size:12px;color:var(--muted);margin:0}
.err{color:var(--warn);font-size:13px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-block:20px}
.kpi{padding:14px 16px;border-radius:6px;background:var(--surface)}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:600}
.kpi small{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px;display:flex}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.m10{background:var(--muted)}
.sec{display:grid;gap:12px;padding-block:8px 24px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:18px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface)}
.sid{font-weight:700}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;border:1px solid}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.mid{color:var(--mid);border-color:var(--mid)}
.pill.off{color:var(--muted);border-color:var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:13px}
.tab[aria-pressed="true"]{border-color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.tools{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gcard{display:grid;gap:8px;padding:10px;border-radius:8px;background:linear-gradient(180deg,var(--ice-a),var(--ice-b));min-width:0}
.gpair{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.gph{position:relative;aspect-ratio:3/4;max-width:100%;background:#eef3f9;overflow:hidden}
.gph img{width:100%;height:100%;object-fit:cover;display:block}
.gph .lab{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:2px 12px;border-radius:6px;background:rgba(255,255,255,.88);color:#17336d;font-family:var(--f-display);font-size:14px;font-weight:600;white-space:nowrap}
.gph .none{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#6b7487}
.chev{position:absolute;left:calc(50% - 13px);top:calc(50% - 15px);width:26px;height:30px;z-index:2}
.gcap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding-inline:2px}
.gcap b{font-family:var(--f-display);font-size:14px;color:var(--fg)}
.empty{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.back{justify-self:start;background:none;border:0;padding:0;color:var(--accent);font-size:14px}
.loading{color:var(--muted);font-size:13px}
.tg{display:inline-block;font-size:11px;padding:0 7px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;margin-left:4px}
</style>
</head>

<script>
(function(){
// マイナステン記録と同じFirebaseプロジェクトを使います（管理者ID admin@ais.com）
const FIREBASE_CONFIG={apiKey:"AIzaSyDLmfVd_NB2jhf1JW0bYU3LV-Nn4I7It_8",authDomain:"minusten-record.firebaseapp.com",projectId:"minusten-record",storageBucket:"minusten-record.firebasestorage.app",messagingSenderId:"580936800601",appId:"1:580936800601:web:53448d29ba99ad97031448"};
const FB="10.14.1",PHOTO_LIMIT=4000;
const TYPES={hair:{long:"髪（育毛）",angles:[["top","頭頂部"],["front","生え際"],["back","後頭部"]]},face:{long:"お顔（美肌）",angles:[["front","正面"],["right","右側"],["left","左側"]]}};
const CHEV='<svg class="chev" viewBox="0 0 26 30" aria-hidden="true"><path d="M2 3l9 12-9 12h6l9-12L8 3z" fill="#17336d"/><path d="M11 3l9 12-9 12h6l9-12-9-12z" fill="#17336d"/></svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>{const p=String(s||"").split("-");return p.length===3?(+p[1])+"/"+(+p[2]):"-"};
const fmtDate=t=>{if(!t)return"-";const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`};
const daysSince=t=>t?Math.floor((Date.now()-t)/864e5):null;
const dayDiff=(a,b)=>{const p=s=>{const [y,m,d]=String(s).split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
let db,auth,DATA=null,cur=null,galType="hair",galAngle="top",showNames=false,pendingMsg=null,M10PHOTOS=0;

function statusPill(t){const d=daysSince(t);if(d==null)return'<span class="pill off">未使用</span>';if(d<=7)return'<span class="pill good">よく使用</span>';if(d<=30)return'<span class="pill mid">ときどき</span>';return'<span class="pill off">止まっている</span>'}

function showLogin(msg){
  $("#logout").hidden=true;
  $("#main").innerHTML=`<form class="login" id="lf"><div><div class="eyebrow">Youforio Admin</div><h2 style="font-size:22px">管理者ログイン</h2></div>
    <div class="field"><label for="aid">管理者ID</label><input id="aid" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="admin"></div>
    <div class="field"><label for="apw">パスワード</label><input id="apw" type="password" autocomplete="current-password"></div>
    <button class="btn" id="lb" type="submit">ログイン</button>
    <p class="err" id="le" ${msg?"":"hidden"}>${esc(msg||"")}</p>
    <p class="note">このページはユーフォリオの管理者専用です。マイナステンの管理ページと同じ管理者IDで入れます。サロンの写真は閲覧のみで、ここから変更や削除はできません。</p></form>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const id=$("#aid").value.trim(),pw=$("#apw").value,b=$("#lb");
    b.disabled=true;b.textContent="ログインしています…";
    try{await auth.signInWithEmailAndPassword(id.includes("@")?id:`${id}@ais.com`,pw)}
    catch(err){const c=err&&err.code||"";b.disabled=false;b.textContent="ログイン";const le=$("#le");le.hidden=false;le.textContent=/network/.test(c)?"インターネットにつながっているか確認してください。":"管理者IDかパスワードが違います。"}};
}

async function loadAll(){
  $("#main").innerHTML='<p class="loading" style="margin-top:24px">サロンのデータを集めています…</p>';
  const salons=await db.collection("salons").get();M10PHOTOS=0;
  const rows=await Promise.all(salons.docs.map(async d=>{
    const x=d.data()||{},base=d.ref;
    const [cs,vs,m10]=await Promise.all([base.collection("choiku_customers").get(),base.collection("choiku_visits").get(),base.collection("visits").get()]);
    m10.forEach(v=>{M10PHOTOS+=((v.data()||{}).angles||[]).length});
    const customers={};cs.forEach(c=>{const y=c.data()||{};customers[c.id]={id:c.id,name:y.name||"",type:y.type||"hair",visits:[]}});
    let photos=0,lastVisit="";
    vs.forEach(v=>{const y=v.data()||{};const ang=y.angles||[];photos+=ang.length;if((y.date||"")>lastVisit)lastVisit=y.date||"";
      const c=customers[y.customerId];if(c)c.visits.push({id:v.id,date:y.date||"",angles:ang,created:y.created||0})});
    Object.values(customers).forEach(c=>c.visits.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0)));
    const list=Object.values(customers);
    return {uid:d.id,loginId:x.loginId||"(ID未記録)",salonName:x.salonName||"",lastActive:x.choikuLastActive||0,lastVisit,customers:list,
      hair:list.filter(c=>c.type==="hair").length,face:list.filter(c=>c.type==="face").length,visitCount:vs.size,photos};
  }));
  DATA=rows.filter(r=>r.lastActive||r.customers.length).sort((a,b)=>(b.lastActive||0)-(a.lastActive||0));
}

function renderHome(){
  cur=null;const R=DATA,tot=k=>R.reduce((s,r)=>s+(typeof k==="function"?k(r):r[k]),0);
  const photos=tot("photos"),all=photos+M10PHOTOS,pc=n=>Math.min(100,n/PHOTO_LIMIT*100),pct=Math.round(pc(all)),active=R.filter(r=>daysSince(r.lastActive)!=null&&daysSince(r.lastActive)<=30).length;
  $("#main").innerHTML=`
  <section class="kpis">
    <div class="kpi"><span>超育を使っているサロン</span><b class="num">${R.length}</b><small>　うち30日以内に使用 ${active}</small></div>
    <div class="kpi"><span>お客様の合計</span><b class="num">${tot(r=>r.customers.length)}</b><small>名（育毛 ${tot("hair")}・美肌 ${tot("face")}）</small></div>
    <div class="kpi"><span>記録の合計</span><b class="num">${tot("visitCount")}</b><small>回分</small></div>
    <div class="kpi"><span>写真の枚数（無料枠の目安 ${PHOTO_LIMIT.toLocaleString()}枚・マイナステンと合算）</span><b class="num">${all.toLocaleString()}</b><small>　${pct}%　超育 ${photos.toLocaleString()}・マイナステン ${M10PHOTOS.toLocaleString()}</small><div class="meter"><i style="width:${pc(photos)}%"></i><i class="m10" style="width:${Math.max(0,pc(all)-pc(photos))}%"></i></div></div>
  </section>
  <section class="sec"><div class="sec-head"><h2>サロン一覧</h2><span class="note">超育を最後に使った日が新しい順。行を押すと写真を見られます。</span></div>
    ${R.length?`<div class="tbl"><table><thead><tr><th>サロンID</th><th>サロン名</th><th>状況</th><th class="r">育毛</th><th class="r">美肌</th><th class="r">記録</th><th class="r">写真</th><th>最後に使った日</th><th>最後の撮影日</th></tr></thead><tbody>
    ${R.map((r,i)=>`<tr data-i="${i}" tabindex="0"><td class="sid">${esc(r.loginId)}</td><td>${esc(r.salonName)||'<span class="muted">未設定</span>'}</td><td>${statusPill(r.lastActive)}</td><td class="r num">${r.hair}</td><td class="r num">${r.face}</td><td class="r num">${r.visitCount}</td><td class="r num">${r.photos}</td><td class="num">${fmtDate(r.lastActive)}</td><td class="num">${r.lastVisit?r.lastVisit.replace(/-/g,"/"):"-"}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">まだ超育のデータがありません。サロンが超育サロン記録でログインすると、ここに表示されます。</div>`}
    <p class="note">「止まっている」は30日以上使われていないサロンです。継続のフォローの連絡の目安にしてください。</p>
  </section>`;
  document.querySelectorAll("tr[data-i]").forEach(tr=>{const go=()=>openSalon(DATA[+tr.dataset.i]);tr.onclick=go;tr.onkeydown=e=>{if(e.key==="Enter")go()}});
}

const photoCache={};
function getPhoto(uid,vid,a){const k=uid+"/"+vid+"_"+a;if(!photoCache[k])photoCache[k]=db.collection("salons").doc(uid).collection("choiku_photos").doc(vid+"_"+a).get().then(d=>d.exists?(d.data()||{}).data:null).catch(()=>null);return photoCache[k]}
function lab(vs,i){if(i===0)return"スタート時";const d=dayDiff(vs[0].date,vs[i].date);if(d<=0)return"スタート当日";if(d<7)return d+"日後";return Math.floor(d/7)+"週間後"}
function pairsFor(r,type,a){const out=[];r.customers.forEach(c=>{if(c.type!==type)return;const vs=c.visits;const ai=vs.findIndex(v=>v.angles.includes(a));let bi=-1;for(let i=vs.length-1;i>ai;i--){if(vs[i].angles.includes(a)){bi=i;break}}
  if(ai>=0&&bi>=0)out.push({c,A:vs[ai],B:vs[bi],la:lab(vs,ai),lb:lab(vs,bi)})});
  return out.sort((x,y)=>x.B.date<y.B.date?1:x.B.date>y.B.date?-1:0)}
function openSalon(r){
  cur=r;const AN=TYPES[galType].angles;if(!AN.some(([a])=>a===galAngle))galAngle=AN[0][0];
  const items=pairsFor(r,galType,galAngle);
  $("#main").innerHTML=`<section class="sec" style="padding-top:18px">
    <button class="back" id="bk">← サロン一覧に戻る</button>
    <div class="sec-head"><div><div class="eyebrow">${esc(r.loginId)}</div><h2 style="font-size:22px">${esc(r.salonName)||esc(r.loginId)}</h2></div>
      <span class="note num">育毛 ${r.hair}名・美肌 ${r.face}名・記録 ${r.visitCount}回分・最後に使った日 ${fmtDate(r.lastActive)}</span></div>
    <div class="tools"><div class="tabs">${Object.entries(TYPES).map(([k,t])=>`<button class="tab" data-t="${k}" aria-pressed="${k===galType}">${t.long}</button>`).join("")}</div>
      <div class="tabs">${AN.map(([a,l])=>`<button class="tab" data-a="${a}" aria-pressed="${a===galAngle}">${l}</button>`).join("")}</div>
      <label class="chk"><input type="checkbox" id="nm" ${showNames?"checked":""}> お客様のお名前を表示</label></div>
    ${items.length?`<div class="gal">${items.map((x,i)=>`<div class="gcard"><div class="gpair"><div class="gph" id="pa${i}"><span class="none">読み込み中…</span><span class="lab">${x.la}</span></div>${CHEV}<div class="gph" id="pb${i}"><span class="none">読み込み中…</span><span class="lab">${x.lb}</span></div></div>
      <div class="gcap"><b>${x.la} → ${x.lb}</b><span class="num">${showNames?esc(x.c.name)+" 様・":""}${md(x.A.date)} → ${md(x.B.date)}</span></div></div>`).join("")}</div>`
      :`<div class="empty">この角度で2回以上撮影したお客様はまだいません。</div>`}
    <p class="note">各お客様のスタート時と最新の写真を並べています。閲覧のみで、ここから変更はできません。</p></section>`;
  $("#bk").onclick=renderHome;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{galType=b.dataset.t;galAngle=TYPES[galType].angles[0][0];openSalon(r)});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{galAngle=b.dataset.a;openSalon(r)});
  $("#nm").onchange=e=>{showNames=e.target.checked;openSalon(r)};
  items.forEach((x,i)=>{[["pa",x.A],["pb",x.B]].forEach(([k,v])=>getPhoto(r.uid,v.id,galAngle).then(src=>{if(cur!==r)return;const el=$("#"+k+i);if(!el)return;
    const n=el.querySelector(".none");if(n)n.remove();if(src)el.insertAdjacentHTML("afterbegin",`<img src="${src}" alt="" loading="lazy">`);else el.insertAdjacentHTML("afterbegin",'<span class="none">写真なし</span>')}))});
  scrollTo(0,0);
}

(async()=>{
  try{const b=`https://www.gstatic.com/firebasejs/${FB}/`;await loadScript(b+"firebase-app-compat.js");await loadScript(b+"firebase-auth-compat.js");await loadScript(b+"firebase-firestore-compat.js")}
  catch(e){$("#main").innerHTML='<p class="err" style="margin-top:24px">読み込めませんでした。インターネットの接続を確認して、ページを開き直してください。</p>';return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  $("#logout").onclick=()=>auth.signOut();
  auth.onAuthStateChanged(async u=>{
    if(!u){DATA=null;showLogin(pendingMsg);pendingMsg=null;return}
    $("#logout").hidden=false;
    try{await loadAll();renderHome()}
    catch(e){console.warn(e);pendingMsg=/permission/i.test(String(e&&(e.code||e.message)))?"このIDには管理者の権限がありません。管理者IDでログインしてください。":"データを読み込めませんでした。少し時間をおいてお試しください。";await auth.signOut()}
  });
})();
})();
</script>
