<style>
/* Layout: one narrow app column (phone); navy mincho logo on ice-blue water, taken from the 超育 brand visual */
:root{
  --bg:#ffffff; --surface:#eef3f9; --line:#dbe3ee; --fg:#1b2333; --muted:#6b7487;
  --navy:#17336d; --navy-ink:#1f4596; --on-navy:#ffffff; --good:#2f7a6a; --warn:#b5533c;
  --ice-a:#c9d9ee; --ice-b:#f4f8fc; --chev:#17336d; --take:#2f5fb8;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --surface:#18202f; --line:#2a3447; --fg:#eaeef5; --muted:#9aa4b8;
  --navy:#c9d8f3; --navy-ink:#8fb2f0; --on-navy:#0f1420; --good:#7cc4b2; --warn:#e08a74; --ice-a:#26324a; --ice-b:#161d2b; --chev:#8fb2f0; --take:#3f6fc9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420; --surface:#18202f; --line:#2a3447; --fg:#eaeef5; --muted:#9aa4b8;
  --navy:#c9d8f3; --navy-ink:#8fb2f0; --on-navy:#0f1420; --good:#7cc4b2; --warn:#e08a74; --ice-a:#26324a; --ice-b:#161d2b; --chev:#8fb2f0; --take:#3f6fc9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.app{max-width:520px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--navy-ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--navy-ink);text-transform:uppercase}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.top h1{font-size:22px;letter-spacing:.04em;color:var(--fg)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;height:36px;min-width:36px;padding:0 12px;font-size:13px;color:var(--muted);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:6px 20px;border-radius:4px;border:1px solid var(--navy);background:var(--navy);color:var(--on-navy);font-weight:700;letter-spacing:.06em;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.danger{border-color:var(--warn);background:transparent;color:var(--warn)}
.section{padding-block:22px;border-bottom:1px solid var(--line);display:grid;gap:14px}
.section:last-child{border-bottom:none}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h2{font-size:17px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);border-radius:999px;letter-spacing:.06em;vertical-align:middle;font-family:var(--f-body);font-weight:500}
.tag.hair,.tag.face{border-color:var(--navy-ink);color:var(--navy-ink)}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 12px}
.brandbar .logo{height:26px;width:auto;display:block}
.brandbar .sub{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-left:10px}
.brandbar .bl{display:flex;align-items:baseline}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(.9)}}
:root[data-theme="dark"] .logo{filter:brightness(0) invert(.9)}
.hero{margin:0;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,var(--ice-a),var(--ice-b))}
.hero img{display:block;width:100%;height:auto}
.h-big{font-size:24px;letter-spacing:.04em}
.lead{margin:0;font-size:14px}
.ph{position:relative}
.pill{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:2px 12px;border-radius:6px;background:rgba(255,255,255,.85);color:#17336d;font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pair figure{position:relative}
.chev{position:absolute;left:-17px;top:calc((100% - 46px)/2);width:26px;height:30px;z-index:2;pointer-events:none}
.bk-note{display:block;width:100%;margin-top:12px;padding:10px 14px;border:1px solid var(--navy-ink);border-radius:6px;background:transparent;color:var(--fg);font-size:13px;text-align:left}
.bk-note b{color:var(--navy-ink)}
.col-btn{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:left}
.col-btn .thumbs{display:flex;flex:none}
.col-btn .thumbs img{width:44px;height:56px;object-fit:cover;border-radius:3px;border:2px solid var(--bg)}
.col-btn .thumbs img+img{margin-left:-14px}
.col-btn b{display:block;font-family:var(--f-display);font-size:17px}
.col-btn span{font-size:12px;color:var(--muted)}
.col-btn .go{margin-left:auto;color:var(--navy-ink);font-size:20px}
.case{display:grid;gap:8px;margin-top:14px;padding:12px;border-radius:6px;background:linear-gradient(180deg,var(--ice-a),var(--ice-b))}
.case .ttl{font-family:var(--f-display);font-size:15px;font-weight:600}
.gal-tools{display:grid;gap:10px}
.gal-opts{display:flex;flex-wrap:wrap;gap:8px 18px}
.gal{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.gal{grid-template-columns:1fr 1fr}}
.gcard{display:grid;gap:8px;padding:10px;border:0;border-radius:8px;background:linear-gradient(180deg,var(--ice-a),var(--ice-b));text-align:left;width:100%;min-width:0}
.gpair{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.gpair .gph{position:relative;aspect-ratio:3/4;max-width:100%;background:#eef3f9;overflow:hidden}
.gpair .gph img{width:100%;height:100%;object-fit:cover;display:block}
.gpair .chev{left:calc(50% - 13px)}
.gcap{display:flex;justify-content:space-between;gap:8px;padding-inline:2px;font-size:12px;color:var(--muted)}
.gcap b{color:var(--fg);font-family:var(--f-display);font-size:14px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.lb{position:fixed;inset:0;z-index:30;background:#0d111a;color:#fff;display:grid;grid-template-rows:auto 1fr auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));touch-action:pan-y}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lb-top .num{font-size:13px;color:#bbb}
.lb .iconbtn{color:#ddd;border-color:#444}
.lb-stage{position:relative;display:grid;place-items:center;min-height:0}
.lb-pair{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;width:min(100%,calc((100vh - 190px)*1.5));max-width:100%}
.lb-pair .gph{position:relative;aspect-ratio:3/4;max-width:100%;background:#1c2333;overflow:hidden}
.lb-pair .gph img{width:100%;height:100%;object-fit:contain;display:block}
.lb-pair .chev{left:calc(50% - 13px)}
.lb .chev path{fill:#8fb2f0}
.lb-bot{display:grid;gap:10px;text-align:center}
.lb-bot b{font-family:var(--f-display);font-size:17px}
.lb-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lb-nav .btn{background:transparent;border-color:#555;color:#eee}
/* list */
.clist{display:grid}
.crow{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.crow>div{min-width:0}
.crow img{width:64px;height:80px;object-fit:cover;border-radius:3px;background:var(--surface)}
.crow .nm{font-family:var(--f-display);font-size:17px;font-weight:600}
.crow .meta{font-size:13px;color:var(--muted)}
.crow .cnt{font-family:var(--f-display);font-size:26px;color:var(--navy-ink);text-align:right;line-height:1}
.crow .cnt small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.empty-ph{width:64px;height:80px;border:1px dashed var(--line);border-radius:3px;display:grid;place-items:center;font-size:11px;color:var(--muted)}
/* compare */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0;display:grid;gap:6px;min-width:0}
.pair .ph{aspect-ratio:3/4;max-width:100%;background:var(--surface);border-radius:4px;overflow:hidden}
.pair .ph img{width:100%;height:100%;object-fit:contain;display:block}
.pair figcaption{font-size:12px;text-align:center;color:var(--muted)}
.pair figcaption b{display:block;font-family:var(--f-display);font-size:15px;color:var(--fg)}
.pair figure.after figcaption b{color:var(--navy-ink)}
.cropbox{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:4px;overflow:hidden;touch-action:none;background:var(--surface);cursor:grab}
.cropbox canvas{width:100%;height:100%;display:block}
.cropgrid{position:absolute;inset:0;pointer-events:none;border:1px solid rgba(23,51,109,.6);
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(0deg,transparent calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% - .5px),rgba(255,255,255,.55) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% - .5px),rgba(255,255,255,.55) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.pickrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pickrow select{height:40px;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:0 8px;min-width:0}
.pickrow span{color:var(--navy-ink)}
input[type=range]{width:100%;accent-color:var(--navy)}
/* progress */
.prog{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-radius:6px;background:var(--surface)}
.prog b{font-family:var(--f-display);font-size:28px;color:var(--navy-ink);line-height:1}
.prog span{font-size:13px;color:var(--muted)}
.remind{padding:10px 14px;border:1px solid var(--navy-ink);border-radius:6px;font-size:13px}
.remind b{color:var(--navy-ink)}
/* timeline */
.tl{display:grid}
.tli{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.tli>div{min-width:0}
.tli:last-child{border-bottom:none}
.tli img{width:56px;height:70px;object-fit:cover;border-radius:3px}
.tli .ttl{font-weight:700}
.tli .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tact{display:grid;gap:2px;justify-items:end}
.linkbtn{background:none;border:none;color:var(--muted);font-size:12px;padding:4px 0;text-decoration:underline}
.linkbtn.warn{color:var(--warn)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{height:40px;padding:0 4px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:13px;white-space:nowrap}
.tab[aria-pressed="true"]{border-color:var(--navy);color:var(--navy-ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--navy)}
.tab .ok{color:var(--good)}
.noph{width:100%;height:100%;display:grid;place-items:center;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:3px}
.tli .noph{width:56px;height:70px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(30px + env(safe-area-inset-bottom,0px))}
.field{display:grid;gap:6px}
.field label,.flabel{font-size:13px;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:10px 12px;width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;min-width:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--on-navy)}
.guide{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:14px;background:var(--surface);border-radius:4px}
.guide img{width:96px;height:120px;object-fit:cover;border-radius:3px}
.guide ul{margin:6px 0 0;padding-left:1.1em;font-size:13px}
.note{font-size:12px;color:var(--muted)}
.shareimg{width:100%;border:1px solid var(--line);border-radius:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm{padding:14px;border:1px solid var(--warn);border-radius:4px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;left:-9999px}
.cam{position:fixed;inset:0;z-index:40;background:#000;display:grid;grid-template-rows:1fr auto}
.cam video{width:100%;height:100%;object-fit:contain;min-height:0;display:block}
.cam-msg{position:absolute;left:16px;right:16px;top:40%;text-align:center;color:#fff;font-size:14px;line-height:1.7}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.cam-sm{justify-self:center;height:40px;padding:0 16px;border:1px solid #555;border-radius:999px;background:transparent;color:#eee;font-size:14px}
.cam-shot{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#3f6fc9;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.cam-shot:disabled{opacity:.4}
.iab{display:grid;gap:4px;margin:12px 0 0;padding:12px 14px;border:1px solid var(--navy-ink);border-radius:6px;background:var(--surface);font-size:13px;line-height:1.6}
.iab b{color:var(--navy-ink);font-size:14px}
.btn.take{background:var(--take);border-color:var(--take);color:#fff}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(63,111,201,0)}40%{box-shadow:0 0 0 8px rgba(63,111,201,.45)}}
.flash{animation:flash 1.2s ease 2}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--take)}}
.cam-hint{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:6px;background:var(--surface);font-size:13px;line-height:1.6}
.ok-dot{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #333;color:#222;display:grid;place-items:center;font-size:14px;font-weight:700}
.steps{margin:0;padding-left:1.3em;font-size:13px;display:grid;gap:4px}
.cloud-chip{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:6px 12px;border-radius:999px;background:var(--surface);font-size:12px;width:max-content;max-width:100%}
.cloud-chip .cs{color:var(--muted)}
.cloud-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.cloud-chip .dot.busy{background:#3f6fc9}
.cloud-chip .dot.err{background:var(--warn)}
.manlink{color:var(--navy-ink);font-weight:700;white-space:nowrap}
</style>

const CHEV='<svg class="chev" viewBox="0 0 26 30" aria-hidden="true"><path d="M2 3l9 12-9 12h6l9-12L8 3z" fill="var(--chev)"/><path d="M11 3l9 12-9 12h6l9-12-9-12z" fill="var(--chev)"/></svg>';

// ---------- types: 育毛（髪） / 美肌（お顔） ----------
const TYPES={
  hair:{label:"育毛",part:"髪",long:"髪（育毛）",en:"HAIR",angles:[["top","頭頂部"],["front","生え際"],["back","後頭部"]],
    tip:{top:"真上から、頭頂部が枠の中央に来るように",front:"正面やや上から、前髪を上げて生え際を見せる",back:"真後ろから、後頭部全体が入る距離で"}},
  face:{label:"美肌",part:"お肌",long:"お顔（美肌）",en:"SKIN",angles:[["front","正面"],["right","右側"],["left","左側"]],
    tip:{front:"真正面から、髪を上げて顔全体を",right:"右側から真横に、頬とフェイスラインを",left:"左側から真横に、頬とフェイスラインを"}}
};
const ALL_ANG=["top","front","back","right","left"];
const T=c=>TYPES[c&&c.type]||TYPES.hair;
const angName=(c,a)=>(T(c).angles.find(x=>x[0]===a)||[,""])[1];

// ---------- data ----------
function sampleCustomers(){
  const mk=(n,name,days)=>({id:"sample-"+n,name,type:"hair",sample:true,visits:[
    {id:"sample-"+n+"-0",date:daysAgo(days),ph:{top:`sample:s${n}-b`},memo:"超育スタート"},
    {id:"sample-"+n+"-1",date:today(),ph:{top:`sample:s${n}-a`},memo:"ホームケアで継続中"}]});
  return [mk(1,"見本 60代男性",21),mk(2,"見本 40代男性",70)];
}
function myTracks(){return [{id:"hair",type:"hair",name:"髪（育毛）",visits:[]},{id:"face",type:"face",name:"お顔（美肌）",visits:[]}]}
function defaultState(){return SALON?{salon:"",customers:sampleCustomers()}:{salon:"",customers:myTracks()}}
function migrate(st){
  if(!st||!Array.isArray(st.customers))return defaultState();
  if(!SALON){["hair","face"].forEach(t=>{if(!st.customers.some(c=>c.id===t))st.customers.push(myTracks().find(x=>x.id===t))})}
  st.customers.forEach(c=>{c.type=c.type||"hair";c.visits=c.visits||[];c.visits.forEach(v=>{v.ph=v.ph||{}})});
  return st;
}
let S=null,LOCAL_S=null;
const DBN=SALON?"choiku-salon":"choiku-my";
function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function load(){try{const db=await openDB();return await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get("state");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function save(){if(CLOUD.on){cloudSync();return}LOCAL_S=S;try{const db=await openDB();db.transaction("kv","readwrite").objectStore("kv").put(JSON.parse(JSON.stringify(S)),"state")}catch(e){}}

// ---------- view state ----------
let view={name:"list",cid:null,a:0,b:0,angle:null};
let listFilter="all";
const cust=()=>S.customers.find(c=>c.id===view.cid);
const startDate=c=>c.visits.length?c.visits[0].date:null;
// 1枚目 = スタート時、以降はスタートからの経過（○日後 / ○週間後）
const lab=(c,i)=>{const v=c.visits[i];if(!v)return"";if(i===0)return"スタート時";const d=dayDiff(startDate(c),v.date);
  if(d<=0)return"スタート当日";if(d<7)return d+"日後";return Math.floor(d/7)+"週間後"};
const sinceStart=c=>startDate(c)?dayDiff(startDate(c),today())+1:0;
const angPh=(v,a)=>v&&v.ph?v.ph[a]||null:null;
const mainPh=(c,v)=>{if(!v)return null;for(const [a] of T(c).angles){if(angPh(v,a))return angPh(v,a)}return null};
const phBox=(p,alt)=>p?`<img src="${srcOf(p)}" alt="${esc(alt)}">`:`<div class="noph">未撮影</div>`;
const toCanvas=im=>{const cv=document.createElement("canvas");cv.width=im.naturalWidth;cv.height=im.naturalHeight;cv.getContext("2d").drawImage(im,0,0);return cv};
const sortV=c=>c.visits.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0));
const loadImg=src=>new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});

// ---------- list ----------
function backupNote(){if(CLOUD.on)return"";const real=S.customers.some(c=>!c.sample&&c.visits.length);if(!real)return"";
  const old=!S.lastBackup||(Date.now()-new Date(S.lastBackup))/864e5>30;
  return old?`<button class="bk-note" id="bkNote"><b>バックアップ</b> ${S.lastBackup?"前回から30日以上たっています":"まだ保存していません"}。ここから保存できます →</button>`:""}
function renderList(){
  const shown=S.customers.filter(c=>!SALON||listFilter==="all"||c.type===listFilter);
  const rows=shown.map(c=>{const v=c.visits[c.visits.length-1],n=c.visits.length;
    const meta=!v?(SALON?"まだ撮影していません":"タップしてスタート時の写真を撮る"):
      (SALON?"前回 "+md(v.date)+"・"+lab(c,n-1):"はじめて "+sinceStart(c)+"日目・前回 "+md(v.date));
    return `<button class="crow" data-open="${c.id}">
      ${mainPh(c,v)?`<img src="${srcOf(mainPh(c,v))}" alt="">`:`<div class="empty-ph">${SALON?"":"未登録"}</div>`}
      <div><div class="nm">${esc(c.name)}${SALON?" 様":""} ${SALON?`<span class="tag ${c.type}">${T(c).label}</span>`:""} ${c.sample?'<span class="tag">見本</span>':""}</div>
      <div class="meta num">${meta}</div></div>
      <div class="cnt num">${n}<small>枚の記録</small></div></button>`}).join("");
  const hairItems=SALON?galItems("hair","top",true):[],allN=SALON?hairItems.length+galItems("face","front",true).length:0;
  $("#app").innerHTML=`
  <header class="brandbar"><div class="bl"><img class="logo" src="${LOGO}" alt="超育"><span class="sub">${SALON?"サロン記録":"マイ記録"}</span></div><button class="iconbtn" id="setBtn">${SALON&&FIREBASE_CONFIG?"設定・共有":"設定・バックアップ"}</button></header>
  ${CLOUD.on?`<div class="cloud-chip" id="cloudChip">${chipHTML()}</div>`:""}
  <figure class="hero"><img src="${BANNER}" alt="超育 ご自宅で最新のエイジングケアが可能に" width="1200" height="792"></figure>
  ${backupNote()}
  ${SALON&&allN?(()=>{const src=hairItems.length?hairItems:galItems("face","front",true),a=hairItems.length?"top":"front";const t=src.slice(0,3).map(x=>`<img src="${srcOf(angPh(x.B,a))}" alt="">`).join("");return `<button class="col-btn" id="colBtn"><span class="thumbs">${t}</span><span><b>コレクション</b><span>ビフォアアフター ${allN}件を一覧で見る</span></span><span class="go">›</span></button>`})():""}
  ${!SALON?`<div class="case"><div class="ttl">事例：60代男性・3週間</div>${pairHTML({A:{ph:{top:"sample:s1-b"}},B:{ph:{top:"sample:s1-a"}},la:"スタート時",lb:"3週間後"},"top",false)}<p class="note" style="margin:0">同じ角度で撮り続けると、自分の変化をこのように見比べられます。</p></div>`:""}
  <section class="section">
    <div class="sec-head"><div><div class="eyebrow">${SALON?"Choiku Salon Record":"My Choiku Record"}</div><h2 class="h-big">${SALON?"お客様の記録":"わたしの記録"}</h2></div>${SALON?`<span class="muted num">${S.customers.length}名</span>`:""}</div>
    <p class="lead">${SALON?"超育をはじめた日（スタート時）と、その後の変化を同じ角度で残します。育毛は頭頂部・生え際・後頭部、美肌は正面・右側・左側。<span class=\"muted\">見本の2名は試し用です。</span>":"超育をはじめた日の写真を撮り、2週間ごとに同じ角度で撮りましょう。変化が目で見えると続けやすくなります。"} <a class="manlink" href="${MANUAL}" target="_blank" rel="noopener">使い方を見る ›</a></p>
    ${SALON?`<div class="tabs" id="lf">${[["all","すべて"],["hair","育毛"],["face","美肌"]].map(([k,l])=>`<button class="tab" data-lf="${k}" aria-pressed="${k===listFilter}">${l}</button>`).join("")}</div>`:""}
    <div class="clist">${rows||'<p class="muted">この種類のお客様はまだいません。</p>'}</div>
    ${SALON?'<div id="addArea"><button class="btn ghost block" id="addBtn">＋ お客様を追加</button></div>':""}
  </section>`;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openCustomer(b.dataset.open));
  document.querySelectorAll("[data-lf]").forEach(b=>b.onclick=()=>{listFilter=b.dataset.lf;renderList()});
  if($("#addBtn"))$("#addBtn").onclick=()=>{let typ=listFilter==="face"?"face":"hair";
    const paint=()=>{const nv=($("#newName")||{}).value||"";$("#addArea").innerHTML=`<div style="display:grid;gap:12px"><div class="field"><label for="newName">お名前</label><input id="newName" placeholder="例：鈴木 由美" value="${esc(nv)}"></div>
      <div class="field"><span class="flabel">記録する内容</span><div class="chips">${Object.entries(TYPES).map(([k,t])=>`<button class="chip" data-typ="${k}" aria-pressed="${k===typ}">${t.long}</button>`).join("")}</div></div>
      <p class="note" style="margin:0">育毛と美肌の両方をされるお客様は、それぞれ追加してください。</p>
      <div class="row2"><button class="btn ghost" id="addCancel">やめる</button><button class="btn" id="addOk">追加</button></div></div>`;
      document.querySelectorAll("[data-typ]").forEach(b=>b.onclick=()=>{typ=b.dataset.typ;paint()});
      $("#addCancel").onclick=renderList;
      $("#addOk").onclick=()=>{const n=$("#newName").value.trim();if(!n){$("#newName").focus();return}
        const c={id:uid(),name:n,type:typ,created:Date.now(),visits:[]};S.customers.unshift(c);save();openCustomer(c.id)}};
    paint();$("#newName").focus()};
  $("#setBtn").onclick=openSettings;
  if($("#colBtn"))$("#colBtn").onclick=()=>{if(!hairItems.length){galSt.type="face";galSt.angle="front"}openGallery()};
  if($("#bkNote"))$("#bkNote").onclick=openSettings;
}
function openCustomer(id){view={name:"detail",cid:id,a:0,b:0,angle:null};const c=cust();view.b=Math.max(0,c.visits.length-1);render();scrollTo(0,0)}

// ---------- detail ----------
function renderDetail(){
  const c=cust();if(!c){view.name="list";return renderList()}
  const vs=c.visits,n=vs.length,AN=T(c).angles,nm=SALON?esc(c.name)+" 様":esc(c.name);
  if(view.a>=n)view.a=0;if(view.b>=n)view.b=Math.max(0,n-1);
  const missOf=v=>AN.filter(([a])=>!angPh(v,a));
  const todays=c.sample?[]:vs.map((v,i)=>({v,i})).filter(o=>o.v.date===today()&&missOf(o.v).length);
  const tgt=c.sample?null:todays.length?todays[todays.length-1]:(n&&missOf(vs[n-1]).length?{v:vs[n-1],i:n-1}:null),addTop=todays.length>0;
  const addBtn=tgt?`<button class="btn${addTop?"":" ghost"} block" id="addMore">${lab(c,tgt.i)}に${missOf(tgt.v).map(([,l])=>l).join("・")}を追加</button>`:"";
  const opts=sel=>vs.map((v,i)=>`<option value="${i}" ${i===sel?"selected":""}>${lab(c,i)}（${md(v.date)}）</option>`).join("");
  const A=vs[view.a],B=vs[view.b];
  const lastGap=n?dayDiff(vs[n-1].date,today()):0,shotToday=n&&vs[n-1].date===today();
  let cmp="";
  if(n>=2){
    const av=AN.filter(([a])=>angPh(A,a)||angPh(B,a));
    if(!av.some(([a])=>a===view.angle))view.angle=av.length?av[0][0]:AN[0][0];
    const ang=view.angle;
    cmp=`${av.length>1?`<div class="tabs" style="grid-template-columns:repeat(${av.length},1fr)">${av.map(([a,l])=>`<button class="tab" data-ang="${a}" aria-pressed="${a===ang}">${l}</button>`).join("")}</div>`:""}
    <div class="pair">
      <figure><div class="ph">${phBox(angPh(A,ang),lab(c,view.a)+"の写真")}${angPh(A,ang)?'<span class="pill">Before</span>':""}</div><figcaption class="num"><b>${lab(c,view.a)}</b>${md(A.date)}・${angName(c,ang)}</figcaption></figure>
      <figure class="after">${CHEV}<div class="ph">${phBox(angPh(B,ang),lab(c,view.b)+"の写真")}${angPh(B,ang)?'<span class="pill">After</span>':""}</div><figcaption class="num"><b>${lab(c,view.b)}</b>${md(B.date)}・${angName(c,ang)}</figcaption></figure></div>
    <div class="pickrow"><select id="selA" aria-label="比べる前">${opts(view.a)}</select><span>→</span><select id="selB" aria-label="比べる後">${opts(view.b)}</select></div>`;}
  else if(n===1){const tk=AN.filter(([a])=>angPh(vs[0],a));cmp=`<div class="pair" style="grid-template-columns:repeat(${Math.min(3,Math.max(2,tk.length))},1fr)">${tk.map(([a,l])=>`<figure><div class="ph">${phBox(angPh(vs[0],a),l)}</div><figcaption>${l}</figcaption></figure>`).join("")}</div><p class="muted" style="margin:0">スタート時（基準）の写真です。2週間後くらいに同じ角度で撮ると比較できます。</p>`}
  else cmp=`<p class="muted" style="margin:0">まず「スタート時の写真を撮る」から、超育をはじめる前の${T(c).part}を撮影しましょう。これが比べる基準になります。</p>`;
  const prog=n?`<div class="prog"><b class="num">${sinceStart(c)}</b><span>日目　超育をはじめて${n>=2?"、記録 "+n+"回":""}</span></div>`:"";
  const remind=n&&!shotToday&&lastGap>=14?`<div class="remind"><b>撮影のタイミングです。</b>前回の撮影から${lastGap}日たちました。今日の${T(c).part}を同じ角度で残しましょう。</div>`:"";
  const tl=vs.map((v,i)=>({v,i})).reverse().map(({v,i})=>`<div class="tli">
      ${phBox(mainPh(c,v),"")}
      <div><div class="ttl num">${lab(c,i)} <span class="muted" style="font-weight:400">${md(v.date)}</span></div>
      <div class="sub">写真：${AN.filter(([a])=>angPh(v,a)).map(([,l])=>l).join("・")}</div>
      ${v.memo?`<div class="sub">${esc(v.memo)}</div>`:""}</div>
      <div class="tact"><button class="btn ghost sm" data-edit="${v.id}">編集</button><button class="linkbtn warn" data-del="${v.id}">削除</button></div></div>`).join("");
  $("#app").innerHTML=`
  <header class="top"><button class="iconbtn" id="back">← ${SALON?"一覧":"もどる"}</button><div style="text-align:right;min-width:0"><div class="eyebrow">${T(c).long}・${n}回記録</div><h1>${nm}</h1></div></header>
  <section class="section">
    ${prog}${remind}
    <div class="sec-head"><h2>ビフォア・アフター</h2>${n>=2?'<span class="muted" style="font-size:12px">比べる回は下で変更</span>':""}</div>
    ${cmp}
    ${addTop?addBtn+'<p class="note" style="margin:0">今日撮った回に、まだ撮っていない角度を追加できます。</p>':""}
    ${shotToday&&!addTop?"":`<button class="btn block${addTop?" ghost":""}" id="shoot">${!n?"スタート時の写真を撮る":"今日の写真を撮る"}</button>`}
    ${!addTop?addBtn:""}
    ${n>=2?`<button class="btn ghost block" id="share">${SALON?"お客様に送る画像をつくる":"サロンに送る画像をつくる"}</button>`:""}
  </section>
  <section class="section"><div class="sec-head"><h2>記録</h2></div><div class="tl">${tl||'<p class="muted">記録はまだありません。</p>'}</div>
    ${SALON?'<div id="delCust"><button class="linkbtn warn" id="delC">このお客様を削除</button></div>':""}</section>`;
  $("#back").onclick=()=>{view.name="list";render()};
  if($("#shoot"))$("#shoot").onclick=()=>openCapture();
  if($("#addMore"))$("#addMore").onclick=()=>openCapture(tgt.v.id,missOf(tgt.v)[0][0]);
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openCapture(b.dataset.edit));
  if($("#share"))$("#share").onclick=openShare;
  document.querySelectorAll("[data-ang]").forEach(b=>b.onclick=()=>{view.angle=b.dataset.ang;render()});
  if(n>=2){$("#selA").onchange=e=>{view.a=+e.target.value;render()};$("#selB").onchange=e=>{view.b=+e.target.value;render()}}
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){c.visits=c.visits.filter(v=>v.id!==b.dataset.del);view.a=0;view.b=Math.max(0,c.visits.length-1);save();render();toast("記録を削除しました")}
    else{b.dataset.armed="1";b.textContent="本当に削除";}});
  if($("#delC"))$("#delC").onclick=()=>{$("#delCust").innerHTML=`<div class="confirm"><div>${esc(c.name)} 様の写真と記録をすべて削除します。元に戻せません。${CLOUD.on?"共有しているスタッフ全員の画面から消えます。":""}</div><div class="row2"><button class="btn ghost sm" id="dcN">やめる</button><button class="btn danger sm" id="dcY">削除する</button></div></div>`;
    $("#dcN").onclick=render;$("#dcY").onclick=()=>{S.customers=S.customers.filter(x=>x.id!==c.id);save();view.name="list";render();toast("削除しました")}};
}

function loadFile(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const M=2000,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement("canvas");
  cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
  res(cv)};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

// ---------- in-app camera (Android: the browser can be closed while the camera app is open) ----------
const LIVECAM=/Android/i.test(navigator.userAgent)&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
function openCam(onShot,fallback,startFacing){
  let facing=startFacing||"environment",stream=null;
  const ov=document.createElement("div");ov.className="cam";document.body.appendChild(ov);
  ov.innerHTML=`<video id="camV" playsinline muted autoplay></video>
    <div class="cam-msg" id="camMsg">カメラを起動しています…</div>
    <div class="cam-bar"><button class="cam-sm" id="camX">やめる</button><button class="cam-shot" id="camS" aria-label="撮影" disabled></button><button class="cam-sm" id="camF">切替</button></div>`;
  const v=ov.querySelector("#camV"),msg=ov.querySelector("#camMsg");
  const stop=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};
  const close=()=>{stop();ov.remove()};
  async function start(){
    stop();msg.hidden=false;msg.textContent="カメラを起動しています…";ov.querySelector("#camS").disabled=true;
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:2560},height:{ideal:1920}}});
      v.srcObject=stream;await v.play();msg.hidden=true;ov.querySelector("#camS").disabled=false;
    }catch(err){
      const denied=err&&(err.name==="NotAllowedError"||err.name==="SecurityError");
      msg.innerHTML=(denied?"この画面のカメラは、ブラウザでの許可が必要です。<br>許可しなくても、下のボタンでいつものカメラアプリから撮影できます。":"カメラを起動できませんでした。")+
        '<br><br><button class="btn sm" id="camAlt">いつものカメラアプリで撮る</button>';
      ov.querySelector("#camAlt").onclick=()=>{close();fallback&&fallback()};
    }
  }
  ov.querySelector("#camX").onclick=close;
  ov.querySelector("#camF").onclick=()=>{facing=facing==="environment"?"user":"environment";start()};
  ov.querySelector("#camS").onclick=()=>{
    const w=v.videoWidth,h=v.videoHeight;if(!w||!h)return;
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d");
    if(facing==="user"){g.translate(w,0);g.scale(-1,1)}
    g.drawImage(v,0,0,w,h);close();onShot(cv);
  };
  start();
}

// ---------- capture sheet ----------
function openSheet(html){const sh=$("#sheet");sh.innerHTML=html;sh.hidden=false;sh.scrollTop=0;document.body.style.overflow="hidden"}
function closeSheet(){$("#sheet").hidden=true;$("#sheet").innerHTML="";document.body.style.overflow=""}
function openCapture(editId,startAngle){
  const c=cust(),AN=T(c).angles,editing=editId?c.visits.find(v=>v.id===editId):null;
  const idx=editing?c.visits.indexOf(editing):c.visits.length,prev=idx>0?c.visits[idx-1]:null;
  const me=editing?lab(c,idx):(c.visits.length?"今日":"スタート時"),prevLab=prev?lab(c,idx-1):"";
  const st={angle:startAngle||AN[0][0],crops:{},removed:{}};
  const FW=900,FH=1200,FILL="#eef3f9",ghosts={},TIP=T(c).tip;
  const selfie=c.type==="face"&&!SALON;
  const has=a=>!!st.crops[a]||(!!editing&&!st.removed[a]&&!!angPh(editing,a));
  openSheet(`<div class="app">
    <header class="top"><button class="iconbtn" id="cx">閉じる</button><div style="text-align:right"><div class="eyebrow">${esc(c.name)}${SALON?" 様":""}・${T(c).long}</div><h1>${me}${editing?"を編集":"の撮影"}</h1></div></header>
    <section class="section">
      <div class="field"><span class="flabel">撮影する角度（✓は取り込み済み）</span><div class="tabs" id="tabs"></div></div>
      <div id="panel" style="display:grid;gap:12px"></div>
      <input type="file" id="file" class="vh" accept="image/*" capture="${selfie?"user":"environment"}" tabindex="-1" aria-hidden="true">
      <input type="file" id="file2" class="vh" accept="image/*" tabindex="-1" aria-hidden="true">
    </section>
    <section class="section">
      <div class="field"><label for="dt">日付</label><input type="date" id="dt" value="${editing?editing.date:today()}"></div>
      <div class="field"><label for="memo">メモ</label><textarea id="memo" rows="2" placeholder="${SALON?"使用中の超育、気になる点、次回の提案など":"使っている超育、気づいたことなど"}">${esc(editing?editing.memo:"")}</textarea></div>
      <button class="btn block" id="sv">${editing?"保存する":"記録する"}</button>
      <p class="note" id="err" hidden></p>
      ${editing?'<div id="delV"><button class="linkbtn warn" id="delVb">この回の写真と記録を削除</button></div>':""}
    </section></div>`);
  $("#cx").onclick=closeSheet;

  function paint(ctx,cr,withGhost){
    const {img,s,cx,cy}=cr,iw=img.width,ih=img.height;
    ctx.fillStyle=FILL;ctx.fillRect(0,0,FW,FH);
    ctx.drawImage(img,cx-iw*s/2,cy-ih*s/2,iw*s,ih*s);
    if(withGhost&&cr.ghost&&cr.ga>0){const g=cr.ghost,gw=g.naturalWidth,gh=g.naturalHeight,r=Math.min(FW/gw,FH/gh);
      ctx.globalAlpha=cr.ga;ctx.drawImage(g,(FW-gw*r)/2,(FH-gh*r)/2,gw*r,gh*r);ctx.globalAlpha=1}
  }
  const draw=()=>{const cc=$("#cc"),cr=st.crops[st.angle];if(cc&&cr)paint(cc.getContext("2d"),cr,true)};
  function clean(cr){const cv=document.createElement("canvas");cv.width=FW;cv.height=FH;paint(cv.getContext("2d"),cr,false);return cv}
  function makeCrop(img,a){
    const iw=img.width,ih=img.height,sMin=Math.min(FW/iw,FH/ih),sCov=Math.max(FW/iw,FH/ih),pp=angPh(prev,a);
    const cr={img,s:sCov,cx:FW/2,cy:FH/2,sMin,sCov,sMax:sCov*4,ghost:null,ga:pp?.35:0};
    if(pp){(ghosts[a]=ghosts[a]||loadImg(srcOf(pp))).then(g=>{cr.ghost=g;if(st.angle===a)draw()})}
    return cr;
  }
  function renderTabs(){
    $("#tabs").innerHTML=AN.map(([a,l])=>`<button class="tab" data-tab="${a}" aria-pressed="${a===st.angle}">${has(a)?'<span class="ok">✓</span> ':""}${l}</button>`).join("");
    document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{st.angle=b.dataset.tab;renderTabs();renderPanel()});
  }
  function renderPanel(){
    const a=st.angle,pp=angPh(prev,a),cr=st.crops[a],h=has(a),nextA=(AN.find(([x])=>x!==a&&!has(x))||[])[0];
    $("#panel").innerHTML=`
      ${pp?`<div class="guide"><img src="${srcOf(pp)}" alt="前回の写真"><div><b>前回（${prevLab}）の${angName(c,a)}と同じ構図で</b><ul><li>同じ場所・同じ照明</li><li>${TIP[a]}</li><li>スマホは縦向き</li></ul></div></div>`
        :`<div class="guide" style="grid-template-columns:1fr"><div><b>${angName(c,a)}の撮影</b><ul><li>撮影場所と照明を毎回同じに</li><li>${TIP[a]}</li><li>スマホは縦向き${c.type==="face"?"・メイクなしがおすすめ":""}</li></ul></div></div>`}
      ${h?`<div class="cropbox" id="cb"><canvas id="cc" width="${FW}" height="${FH}"></canvas><div class="cropgrid"></div></div><div id="ctrl" style="display:grid;gap:12px"></div>`:""}
      <div class="row2"><label class="btn${h?" ghost":""}" for="file">${h?"撮り直す":"カメラで撮る"}</label><label class="btn ghost" for="file2">${h?"アルバムから選び直す":"アルバムから選ぶ"}</label></div>
      ${LIVECAM&&!h?`<p class="cam-hint"><span class="ok-dot">✓</span><span>カメラで撮影したあと、画面下の<b>丸い ✓ ボタン</b>を押すと取り込まれます。<br>左の <b>↺</b> は撮り直しです。</span></p>`:""}
      ${LIVECAM?`<button class="linkbtn" id="liveCam" style="justify-self:start">撮った写真が戻ってこないときは：画面の中のカメラで撮る</button>`:""}
      ${h?`<button class="linkbtn warn" id="rmA" style="justify-self:start">この角度の写真を外す</button>`:""}
      ${h?`<button class="btn block take" id="takeA">✓ この写真を取り込む${nextA?`（次は${angName(c,nextA)}）`:""}</button>`:""}`;
    if($("#takeA"))$("#takeA").onclick=()=>{
      if(nextA){toast(`${angName(c,a)}を取り込みました。次は${angName(c,nextA)}です`);st.angle=nextA;renderTabs();renderPanel();$("#tabs").scrollIntoView({block:"start",behavior:"smooth"});return}
      toast(`取り込みました。最後に「${editing?"保存する":"記録する"}」を押してください`);
      const sv=$("#sv");sv.scrollIntoView({block:"center",behavior:"smooth"});sv.classList.remove("flash");void sv.offsetWidth;sv.classList.add("flash");
    };
    if($("#rmA"))$("#rmA").onclick=()=>{delete st.crops[a];st.removed[a]=true;renderTabs();renderPanel()};
    if(cr)mount(cr);
    else if(h){const g=$("#cc").getContext("2d");g.fillStyle=FILL;g.fillRect(0,0,FW,FH);
      loadImg(srcOf(angPh(editing,a))).then(im=>{if(!im||st.angle!==a||st.crops[a])return;st.crops[a]=makeCrop(toCanvas(im),a);renderPanel()})}
  }
  function mount(cr){
    const toT=s=>Math.round(1000*Math.log(s/cr.sMin)/Math.log(cr.sMax/cr.sMin)),toS=t=>cr.sMin*Math.pow(cr.sMax/cr.sMin,t/1000);
    $("#ctrl").innerHTML=`<p class="note" style="margin:0">ドラッグで位置、2本指やスライダーで大きさを変えられます。</p>
      <div class="field"><label for="zm">写真の大きさ</label><input type="range" id="zm" min="0" max="1000" value="${toT(cr.s)}"></div>
      ${angPh(prev,st.angle)?`<div class="field"><label for="op">前回の写真を重ねる（大きさと位置を合わせる目安）</label><input type="range" id="op" min="0" max="80" value="${Math.round(cr.ga*100)}"></div>`:""}
      <div class="row2"><button class="btn ghost sm" id="fitAll">全体を表示</button><button class="btn ghost sm" id="fitFill">枠いっぱい</button></div>`;
    const setS=s=>{s=Math.max(cr.sMin,Math.min(cr.sMax,s));cr.cx=FW/2+(cr.cx-FW/2)*s/cr.s;cr.cy=FH/2+(cr.cy-FH/2)*s/cr.s;cr.s=s;$("#zm").value=toT(s);draw()};
    $("#zm").oninput=e=>setS(toS(+e.target.value));
    if($("#op"))$("#op").oninput=e=>{cr.ga=e.target.value/100;draw()};
    $("#fitAll").onclick=()=>{cr.cx=FW/2;cr.cy=FH/2;cr.s=cr.sMin;$("#zm").value=toT(cr.s);draw()};
    $("#fitFill").onclick=()=>{cr.cx=FW/2;cr.cy=FH/2;cr.s=cr.sCov;$("#zm").value=toT(cr.s);draw()};
    const cb=$("#cb"),pts=new Map();let pinch=0;
    const k=()=>FW/cb.getBoundingClientRect().width;
    cb.addEventListener("pointerdown",e=>{cb.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=0});
    cb.addEventListener("pointermove",e=>{const p=pts.get(e.pointerId);if(!p)return;
      if(pts.size===1){cr.cx+=(e.clientX-p.x)*k();cr.cy+=(e.clientY-p.y)*k();p.x=e.clientX;p.y=e.clientY;draw();return}
      p.x=e.clientX;p.y=e.clientY;const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch)setS(cr.s*d/pinch);pinch=d});
    const end=e=>{pts.delete(e.pointerId);pinch=0};
    cb.addEventListener("pointerup",end);cb.addEventListener("pointercancel",end);
    cb.addEventListener("wheel",e=>{e.preventDefault();setS(cr.s*(e.deltaY<0?1.06:1/1.06))},{passive:false});
    draw();
  }
  const onPick=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const a=st.angle;
    try{const cv=await loadFile(f);st.crops[a]=makeCrop(cv,a);delete st.removed[a];if(st.angle===a){renderTabs();renderPanel()}}
    catch(err){toast("この画像は読み込めませんでした。JPEGかPNGの写真を選んでください。")}};
  $("#file").onchange=onPick;$("#file2").onchange=onPick;
  if(LIVECAM)$("#panel").addEventListener("click",e=>{const l=e.target.closest('#liveCam');if(!l)return;e.preventDefault();const a=st.angle;
    openCam(cv=>{st.crops[a]=makeCrop(cv,a);delete st.removed[a];if(st.angle===a){renderTabs();renderPanel()}},()=>$("#file").click(),selfie?"user":"environment")});
  renderTabs();renderPanel();

  $("#sv").onclick=()=>{
    const ph={};
    AN.forEach(([a])=>{ph[a]=st.crops[a]?clean(st.crops[a]).toDataURL("image/jpeg",.82):(editing&&!st.removed[a]&&angPh(editing,a))||null});
    if(!AN.some(([a])=>ph[a])){const e=$("#err");e.hidden=false;e.textContent="少なくとも1枚、写真を撮るか選んでください。";return}
    const rec={date:$("#dt").value||today(),ph,memo:$("#memo").value.trim()};
    let v=editing;if(v)Object.assign(v,rec);else{v={id:uid(),created:Date.now(),...rec};c.visits.push(v)}
    sortV(c);
    save();closeSheet();if(!editing){view.a=0;view.b=c.visits.length-1}render();if(!editing)scrollTo(0,0);
    toast(editing?"保存しました":`${lab(c,c.visits.indexOf(v))}の写真を記録しました`)};
  if(editing){
    const askDel=()=>{$("#delV").innerHTML=`<div class="confirm"><div>${me}の写真と記録をすべて削除します。元に戻せません。</div><div class="row2"><button class="btn ghost sm" id="dvN">やめる</button><button class="btn danger sm" id="dvY">削除する</button></div></div>`;
      $("#dvN").onclick=()=>{$("#delV").innerHTML='<button class="linkbtn warn" id="delVb">この回の写真と記録を削除</button>';$("#delVb").onclick=askDel};
      $("#dvY").onclick=()=>{c.visits=c.visits.filter(v=>v.id!==editing.id);view.a=0;view.b=Math.max(0,c.visits.length-1);save();closeSheet();render();toast("削除しました")}};
    $("#delVb").onclick=askDel;
  }
}

function syncOnce(){

    try{await cloudLogin(id,pw);toast("ログインしました。共有を始めます")}
    catch(e){const c=e&&e.code||"",msg=e&&e.message||"";m.hidden=false;m.style.color="var(--warn)";
      m.textContent=msg==="load"||msg==="noconfig"?"この画面では共有を使えません。配布用のURL（ホーム画面のアイコン）から開いてください。":
        /network/.test(c)?"インターネットにつながっているか確認してください。":
        /too-many/.test(c)?"何度も間違えたため、しばらくログインできません。少し時間をおいてください。":"サロンIDかパスワードが違います。";
      b.disabled=false;b.textContent="ログインして共有を始める"}
  };
  if($("#upBtn"))$("#upBtn").onclick=()=>{const plan=planMerge(LOCAL_S);
    $("#upArea").innerHTML=`<div class="confirm" style="border-color:var(--line)"><div>新しいお客様 <b>${plan.newC}名</b>、追加される記録 <b>${plan.addV}回分</b>を共有に追加します。同じお名前・同じ種類（育毛／美肌）のお客様は1人にまとめます。</div><div class="row2"><button class="btn ghost sm" id="upN">やめる</button><button class="btn sm" id="upY">追加する</button></div></div>`;
    $("#upN").onclick=openSettings;$("#upY").onclick=()=>{applyMerge(LOCAL_S);sortCustomers();save();closeSheet();render();toast(`${plan.addV}回分の記録を共有に追加しました`)}};
  if($("#loBtn"))$("#loBtn").onclick=()=>{$("#loArea").innerHTML=`<div class="confirm"><div>ログアウトすると、このスマホでは共有の写真が見られなくなります（共有の記録自体は消えません）。</div><div class="row2"><button class="btn ghost sm" id="loN">やめる</button><button class="btn danger sm" id="loY">ログアウト</button></div></div>`;
    $("#loN").onclick=openSettings;$("#loY").onclick=cloudLogout};
}

// ---------- merge another staff member's backup ----------
const normName=n=>String(n||"").replace(/[\s　]+/g,"").replace(/様$/,"");
function mergeWork(inc,apply){
  const r={newC:0,updC:0,addV:0};
  (inc.customers||[]).forEach(ic=>{
    if(ic.sample||!Array.isArray(ic.visits))return;
    const typ=ic.type||"hair";
    let lc=S.customers.find(c=>c.id===ic.id)||S.customers.find(c=>!c.sample&&(c.type||"hair")===typ&&normName(c.name)===normName(ic.name));
    if(!lc){r.newC++;r.addV+=ic.visits.length;if(apply){const cp=JSON.parse(JSON.stringify(ic));cp.type=typ;cp.visits.forEach(v=>v.ph=v.ph||{});S.customers.push(cp)}return}
    const have=new Set(lc.visits.map(v=>v.id));let added=0;
    ic.visits.forEach(v=>{if(have.has(v.id))return;added++;if(apply){const cp=JSON.parse(JSON.stringify(v));cp.ph=cp.ph||{};lc.visits.push(cp)}});
    if(added){r.updC++;r.addV+=added;if(apply)sortV(lc)}
  });
  return r;
}
const planMerge=st=>mergeWork(st,false);
function applyMerge(st){mergeWork(st,true)}

// ---------- settings ----------
function readJSONFile(f,cb,errEl){const fr=new FileReader();fr.onload=()=>{let st=null,at="";try{const o=JSON.parse(fr.result);if(o.app&&o.app!==APP_ID)throw 0;st=o.state||o;at=o.savedAt?o.savedAt.slice(0,10).replace(/-0?/g,"/"):"";if(!st||!Array.isArray(st.customers))throw 0}
  catch(err){$(errEl).innerHTML=`<p class="note" style="color:var(--warn);margin:0">このファイルはこのアプリのバックアップとして読み込めませんでした。「${APP_ID}-backup-日付.json」のファイルを選んでください。</p>`;return}cb(st,at)};fr.readAsText(f)}
const APP_ID=SALON?"choiku-salon":"choiku-my";
function openSettings(){
  openSheet(`<div class="app"><header class="top"><button class="iconbtn" id="cx">閉じる</button><h1>設定</h1></header>
    <a class="btn ghost block" style="margin-top:14px;text-decoration:none" href="${MANUAL}" target="_blank" rel="noopener">使い方を見る（画面の写真つき）</a>
    <section class="section">
      <div class="field"><label for="sn">${SALON?"サロン名（送る画像に入ります）":"通っているサロン名（送るメッセージに入ります）"}</label><input id="sn" value="${esc(S.salon)}" placeholder="例：Hair Salon ○○"></div>
      <button class="btn block" id="ss">保存</button>
    </section>
    ${SALON?cloudSectionHTML():""}
    <section class="section" id="bkSec"><h2 style="font-size:16px">バックアップ</h2>
      <p class="note" style="margin:0">${CLOUD.on?"共有中の記録はクラウドに保存されています。念のための控えとして、ファイルにも保存できます。":"写真と記録はこのスマホの中だけに保存されています。機種変更やデータの削除に備えて、月に1回ほどバックアップを保存してください。"}</p>
      <p class="num" style="margin:0;font-size:13px">最後のバックアップ：<b>${S.lastBackup?S.lastBackup.replace(/-0?/g,"/"):"まだ保存していません"}</b></p>
      <button class="btn block" id="bkSave">バックアップを保存</button>
      ${CLOUD.on?"":`<label class="btn ghost block" for="bkFile">バックアップから戻す</label>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>`}
      <div id="bkMsg"></div>
      <p class="note" style="margin:0">iPhoneは共有画面で「"ファイル"に保存」を選びます。Androidは「ダウンロード」フォルダに保存されます。${CLOUD.on?"":"新しいスマホでは、このアプリを開いて「バックアップから戻す」で保存したファイルを選びます。「バックアップから戻す」は今の記録と置き換わります。"}</p>
    </section>
    ${SALON?`<section class="section"><h2 style="font-size:16px">スタッフの記録をまとめる</h2>
      <p class="note" style="margin:0">他のスタッフが保存したバックアップファイルを選ぶと、<b>今の記録に追加</b>します。今ある写真や記録は消えません。${FIREBASE_CONFIG?"サロンIDで共有している場合は、この操作はいりません。":""}</p>
      <ol class="steps">
        <li>各スタッフが「バックアップを保存」を押し、共有画面で<b>LINE</b>を選んで、お店のグループやまとめ役のスタッフに送る</li>
        <li>まとめ役のスマホでLINEのファイルを開いて保存する（iPhoneは「"ファイル"に保存」）</li>
        <li>下の「追加で取り込む」でそのファイルを選ぶ</li>
      </ol>
      <label class="btn block" for="mgFile">追加で取り込む</label>
      <input type="file" id="mgFile" accept=".json,application/json" hidden>
      <div id="mgMsg"></div>
      <p class="note" style="margin:0">同じお名前・同じ種類（育毛／美肌）のお客様は1人にまとめ、写真の回を追加します。同じ記録を2回取り込んでも重複しません。</p>
    </section>`:""}
    ${CLOUD.on?"":`<section class="section"><h2 style="font-size:16px">記録の削除</h2>
      <p class="note" style="margin:0">${SALON?"このスマホの記録だけが消えます。他のスタッフのスマホには影響しません。":"記録はあなたのスマホの中だけにあり、サロンや他の人には見えません。"}</p>
      <div id="rs"><button class="linkbtn warn" id="rsb">${SALON?"すべて消して見本に戻す":"すべての記録を消す"}</button></div></section>`}</div>`);
  $("#cx").onclick=closeSheet;
  if(SALON)bindCloudSection();
  $("#ss").onclick=()=>{S.salon=$("#sn").value.trim();save();closeSheet();render();toast("保存しました")};
  $("#bkSave").onclick=async()=>{const b=$("#bkSave");b.disabled=true;await saveBackup();b.disabled=false;if(!$("#sheet").hidden&&$("#bkSave"))openSettings()};
  if($("#bkFile"))$("#bkFile").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
    readJSONFile(f,(st,at)=>{
      $("#bkMsg").innerHTML=`<div class="confirm"><div>${SALON?st.customers.filter(c=>!c.sample).length+"名分の":""}記録${at?"（"+at+" 保存）":""}を読み込みます。今このスマホにある記録は置き換わります。</div><div class="row2"><button class="btn ghost sm" id="bkN">やめる</button><button class="btn danger sm" id="bkY">読み込む</button></div></div>`;
      $("#bkN").onclick=()=>{$("#bkMsg").innerHTML=""};
      $("#bkY").onclick=()=>{S=migrate(st);save();closeSheet();view={name:"list"};render();toast("バックアップから戻しました")}},"#bkMsg")};
  if($("#mgFile"))$("#mgFile").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;$("#mgMsg").innerHTML='<p class="note" style="margin:0">読み込んでいます…</p>';
    readJSONFile(f,st=>{
      const plan=planMerge(st);
      if(!plan.newC&&!plan.addV){$("#mgMsg").innerHTML='<p class="note" style="margin:0">このファイルの記録は、すべてこのスマホに入っています。追加するものはありません。</p>';return}
      $("#mgMsg").innerHTML=`<div class="confirm" style="border-color:var(--line)"><div>新しいお客様 <b>${plan.newC}名</b>、すでにいるお客様への追加 <b>${plan.updC}名</b>、追加される記録 <b>${plan.addV}回分</b>を取り込みます。</div><div class="row2"><button class="btn ghost sm" id="mgN">やめる</button><button class="btn sm" id="mgY">追加する</button></div></div>`;
      $("#mgN").onclick=()=>{$("#mgMsg").innerHTML=""};
      $("#mgY").onclick=()=>{applyMerge(st);save();closeSheet();view={name:"list"};render();toast(`${plan.addV}回分の記録を追加しました`)}},"#mgMsg")};
  if($("#rsb"))$("#rsb").onclick=()=>{$("#rs").innerHTML=`<div class="confirm"><div>撮影した写真と記録がすべて消えます。元に戻せません。</div><div class="row2"><button class="btn ghost sm" id="rN">やめる</button><button class="btn danger sm" id="rY">消す</button></div></div>`;
    $("#rN").onclick=openSettings;$("#rY").onclick=()=>{S=defaultState();save();closeSheet();view={name:"list"};render();toast(SALON?"見本に戻しました":"記録を消しました")}};
}
async function saveBackup(){
  const d=new Date(),stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  const name=`${APP_ID}-backup-${stamp}.json`;
  const out=JSON.parse(JSON.stringify(S));delete out.cloud;
  const blob=new Blob([JSON.stringify({app:APP_ID,version:1,savedAt:d.toISOString(),state:out})],{type:"application/json"});
  const done=()=>{S.lastBackup=today();if(!CLOUD.on)save();toast("バックアップを保存しました")};
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:blob});done();return true}}}catch(e){if(e&&e.code==="declined")return false}
  try{const file=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});done();return true}}catch(e){if(e&&e.name==="AbortError")return false}
  try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);done();return true}catch(e){}
  toast("保存できませんでした");return false;
}

// ---------- collection (salon) ----------
let galSt={type:"hair",angle:"top",names:false,samples:true};
function galItems(type,angle,samples){
  const out=[];
  S.customers.forEach(c=>{if(c.type!==type)return;if(!samples&&c.sample)return;const vs=c.visits;if(vs.length<2)return;
    const ai=vs.findIndex(v=>angPh(v,angle));let bi=-1;for(let i=vs.length-1;i>ai;i--){if(angPh(vs[i],angle)){bi=i;break}}
    if(ai<0||bi<0)return;out.push({c,ai,bi,A:vs[ai],B:vs[bi],la:lab(c,ai),lb:lab(c,bi)})});
  return out.sort((x,y)=>x.B.date<y.B.date?1:x.B.date>y.B.date?-1:0);
}
function pairHTML(x,angle,big){
  return `<div class="${big?"lb-pair":"gpair"}"><div class="gph"><img src="${srcOf(angPh(x.A,angle))}" alt="${x.la}" loading="lazy"><span class="pill">${x.la}</span></div>${CHEV}<div class="gph"><img src="${srcOf(angPh(x.B,angle))}" alt="${x.lb}" loading="lazy"><span class="pill">${x.lb}</span></div></div>`;
}
const galCap=x=>`${x.la} → ${x.lb}`;
function openGallery(){
  const AN=TYPES[galSt.type].angles;if(!AN.some(([a])=>a===galSt.angle))galSt.angle=AN[0][0];
  const items=galItems(galSt.type,galSt.angle,galSt.samples);
  const cards=items.map((x,i)=>`<button class="gcard" data-gi="${i}">${pairHTML(x,galSt.angle,false)}<div class="gcap"><b>${galCap(x)}</b><span class="num">${galSt.names?esc(x.c.name)+" 様・":""}${md(x.B.date)}</span></div></button>`).join("");
  openSheet(`<div class="app"><header class="top"><button class="iconbtn" id="cx">閉じる</button><div style="text-align:right"><div class="eyebrow">Choiku Collection</div><h1>コレクション</h1></div></header>
    <section class="section gal-tools">
      <div class="tabs" style="grid-template-columns:1fr 1fr">${Object.entries(TYPES).map(([k,t])=>`<button class="tab" data-gt="${k}" aria-pressed="${k===galSt.type}">${t.long}</button>`).join("")}</div>
      <div class="tabs">${AN.map(([a,l])=>`<button class="tab" data-ga="${a}" aria-pressed="${a===galSt.angle}">${l}</button>`).join("")}</div>
      <div class="gal-opts"><label class="chk"><input type="checkbox" id="gNames" ${galSt.names?"checked":""}> お名前を表示</label><label class="chk"><input type="checkbox" id="gSamp" ${galSt.samples?"checked":""}> 見本を含める</label></div>
      <p class="note" style="margin:0">各お客様のスタート時と最新の写真を並べています。タップすると大きく表示します。</p>
    </section>
    <section class="section" style="border-bottom:0">${items.length?`<div class="gal">${cards}</div>`:`<p class="muted">この角度で2回以上撮影したお客様がまだいません。</p>`}</section></div>`);
  $("#cx").onclick=closeSheet;
  document.querySelectorAll("[data-gt]").forEach(b=>b.onclick=()=>{galSt.type=b.dataset.gt;galSt.angle=TYPES[galSt.type].angles[0][0];openGallery()});
  document.querySelectorAll("[data-ga]").forEach(b=>b.onclick=()=>{galSt.angle=b.dataset.ga;openGallery()});
  $("#gNames").onchange=e=>{galSt.names=e.target.checked;openGallery()};
  $("#gSamp").onchange=e=>{galSt.samples=e.target.checked;openGallery()};
  document.querySelectorAll("[data-gi]").forEach(b=>b.onclick=()=>openLightbox(items,+b.dataset.gi));
}
function openLightbox(items,i){
  let lb=$("#lb");if(!lb){lb=document.createElement("div");lb.id="lb";lb.className="lb";document.body.appendChild(lb)}
  const show=()=>{const x=items[i],ang=galSt.angle;
    lb.innerHTML=`<div class="lb-top"><span class="num">${i+1} / ${items.length}</span><button class="iconbtn" id="lbX">閉じる</button></div>
      <div class="lb-stage">${pairHTML(x,ang,true)}</div>
      <div class="lb-bot"><div><b>${galCap(x)}</b><div class="num" style="font-size:12px;color:#bbb">${angName(x.c,ang)}・${galSt.names?esc(x.c.name)+" 様・":""}${md(x.A.date)} → ${md(x.B.date)}</div></div>
        <div class="lb-nav"><button class="btn sm" id="lbP" ${i===0?"disabled":""}>‹ 前へ</button><button class="btn sm" id="lbN" ${i===items.length-1?"disabled":""}>次へ ›</button></div>
        <button class="linkbtn" id="lbS" style="color:#ccc">この組み合わせで送る画像をつくる</button></div>`;
    $("#lbX").onclick=close;$("#lbP").onclick=()=>go(-1);$("#lbN").onclick=()=>go(1);
    $("#lbS").onclick=()=>{close();closeSheet();view={name:"detail",cid:x.c.id,a:x.ai,b:x.bi,angle:ang};render();openShare()};
  };
  const go=d=>{const j=i+d;if(j<0||j>=items.length)return;i=j;show()};
  const close=()=>{lb.remove();document.removeEventListener("keydown",key)};
  const key=e=>{if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key==="Escape")close()};
  document.addEventListener("keydown",key);
  let sx=null;lb.onpointerdown=e=>{sx=e.clientX};lb.onpointerup=e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)go(dx<0?1:-1)};
  show();
}

function render(){view.name==="detail"?renderDetail():renderList()}
// ---------- open outside in-app browsers (LINE etc.) ----------
const UA=navigator.userAgent,IN_LINE=/ Line\//i.test(UA),IN_APP=IN_LINE||/FBAN|FBAV|Instagram/i.test(UA);
if(IN_LINE&&!/openExternalBrowser=1/.test(location.search)){location.replace(location.pathname+(location.search?location.search+"&":"?")+"openExternalBrowser=1"+location.hash)}
function inAppBanner(){if(!IN_APP||$("#iab"))return;const isA=/Android/i.test(UA);
  document.body.insertAdjacentHTML("afterbegin",`<div id="iab" class="iab"><b>${isA?"Chrome":"Safari"}で開いてください</b>アプリ内の画面では、撮影やLINEへの送信がうまく動きません。右上（または右下）のメニューから「${isA?"他のアプリで開く":"Safariで開く"}」「ブラウザで開く」を選んでください。</div>`)}
inAppBanner();
(async()=>{S=migrate(await load()||defaultState());LOCAL_S=S;render();if(FIREBASE_CONFIG&&cloudFlag())ensureFirebase().catch(()=>{})})();
})();
</script>
